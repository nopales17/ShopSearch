[project]
name = "shopsearch"
version = "0.1.0"
description = "Camera-native local retail discovery experiment"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "PIL.*", "huggingface_hub.*"]
ignore_missing_imports = true
follow_imports = "skip"
